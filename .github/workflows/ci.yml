name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Port leaves no Cursor-specific text and is idempotent
        run: |
          bash scripts/port-from-cursor.sh
          git diff --exit-code
      - name: poteto-mode tools
        working-directory: skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: statechart
        working-directory: skills/statechart/scripts
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          npm install --no-package-lock --no-audit --no-fund
          TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" npm test
