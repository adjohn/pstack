name: release

# A new release-notes/v<version>.md on main creates tag v<version> on that
# commit and a GitHub release whose body is the file.
on:
  push:
    branches: [main]
    paths: ["release-notes/v*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a release for each notes file without one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release-notes/v*.md; do
            tag=$(basename "$f" .md)
            gh release view "$tag" >/dev/null 2>&1 && continue
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$f"
          done
